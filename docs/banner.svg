<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Pulsemail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2470"/>
      <stop offset="0.55" stop-color="#663399"/>
      <stop offset="1" stop-color="#7a3fb0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC930"/>
      <stop offset="1" stop-color="#c3e85f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- textura sutil -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1120" cy="70" r="180"/>
    <circle cx="240" cy="300" r="150"/>
  </g>
  <!-- sobre con pulso -->
  <g transform="translate(88,100)" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="140" height="100" rx="14"/>
    <path d="M8 14 L74 62 L140 14"/>
  </g>
  <path d="M60 250 H118 L132 226 L150 274 L166 240 L176 250 H262" fill="none" stroke="#9CC930" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">Pulsemail</text>
  <text x="302" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#e9dcff">Campa&#241;as de correo en fr&#237;o, respuestas y rebotes desde el escritorio</text>
  <rect x="302" y="236" width="150" height="8" rx="4" fill="url(#accent)"/>
  <text x="302" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#9CC930" letter-spacing="3">INTELLIHELP</text>
</svg>
